<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Classifica generale - Beach Volley Leon 3C</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-4 pb-20"><main class="max-w-4xl mx-auto"><div class="flex items-center justify-between gap-3 mb-5"><div><h1 class="text-2xl font-black text-blue-700">🏆 Classifica generale</h1><p class="text-sm text-gray-500">Beach Volley Leon 3C</p></div><button id="authBtn" onclick="openAuth()" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl">🔐 Admin</button></div><div id="authBox" class="hidden bg-white rounded-2xl shadow p-4 mb-5"><h2 class="font-bold text-lg mb-3">Accesso amministratore</h2><div class="grid gap-3 md:grid-cols-2"><input id="email" type="email" placeholder="Email" class="p-3 border rounded-lg"><input id="password" type="password" placeholder="Password" class="p-3 border rounded-lg"></div><p id="authError" class="text-red-600 text-sm my-2"></p><div class="flex gap-2"><button onclick="login()" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl">Accedi</button><button onclick="closeAuth()" class="bg-gray-200 font-bold px-4 py-2 rounded-xl">Chiudi</button></div></div><div id="adminBar" class="hidden bg-green-50 border border-green-200 rounded-xl p-3 mb-5 flex items-center justify-between gap-3"><span class="font-bold text-green-800">Modalità amministratore</span><button onclick="logout()" class="bg-white border border-green-300 px-3 py-2 rounded-lg font-bold">Esci</button></div><div id="loading" class="text-center p-8">Caricamento...</div><div id="tableWrap" class="hidden bg-white rounded-2xl shadow overflow-auto"><table class="w-full text-sm"><thead id="thead" class="bg-blue-50"></thead><tbody id="tbody"></tbody></table></div><p id="message" class="text-center text-gray-500 mt-4"></p><div class="mt-5 text-center"><a href="index.html" class="text-blue-600 font-bold">← Torna al torneo</a></div></main>
<script>
const SUPABASE_URL='https://drowryrybuigxuvqpjqx.supabase.co',KEY='sb_publishable_qobUIlouC_-1a0f6sNjV_A_B6bsmDp8';const sb=supabase.createClient(SUPABASE_URL,KEY);let isAdmin=false,players=[],tournaments=[],results=[];
async function load(){const [p,t,r]=await Promise.all([sb.from('players').select('id,name').order('name'),sb.from('tournaments').select('id,name,tournament_date').order('tournament_date',{ascending:true}),sb.from('tournament_results').select('id,tournament_id,player_id,points')]);if(p.error||t.error||r.error){document.getElementById('loading').textContent='Errore nel caricamento della classifica.';return}players=p.data||[];tournaments=t.data||[];results=r.data||[];render()}
function render(){document.getElementById('loading').classList.add('hidden');document.getElementById('tableWrap').classList.remove('hidden');const th=document.getElementById('thead'),tb=document.getElementById('tbody');th.innerHTML='<tr><th class="p-3 text-left sticky left-0 bg-blue-50">Giocatore</th>'+tournaments.map(t=>`<th class="p-3 text-center whitespace-nowrap">${escapeHtml(t.name)}<br><span class="font-normal">${t.tournament_date}</span></th>`).join('')+'<th class="p-3 text-center">Media</th><th class="p-3 text-center admin-col hidden">Modifica</th></tr>';let rows=players.map(p=>{let vals=tournaments.map(t=>{const r=results.find(x=>x.player_id===p.id&&x.tournament_id===t.id);return r?Number(r.points):null});let played=vals.filter(v=>v!==null),avg=played.length?played.reduce((a,b)=>a+b,0)/played.length:0;return{p,vals,avg}}).sort((a,b)=>b.avg-a.avg);tb.innerHTML=rows.map((row,i)=>`<tr class="border-b"><td class="p-3 font-bold sticky left-0 bg-white">${i+1}. ${escapeHtml(row.p.name)}</td>${row.vals.map((v,j)=>`<td class="p-2 text-center">${isAdmin?`<input type="number" min="0" step="0.01" value="${v===null?'':v}" onchange="updatePoints('${row.p.id}','${tournaments[j].id}',this.value)" class="w-20 p-2 text-center border rounded-lg">`:v===null?'—':v}</td>`).join('')}<td class="p-3 text-center font-black">${row.avg.toFixed(2)}</td><td class="p-3 text-center admin-col hidden"><button onclick="editPlayer('${row.p.id}')" class="bg-yellow-100 px-2 py-1 rounded">✏️</button></td></tr>`).join('');document.querySelectorAll('.admin-col').forEach(x=>x.classList.toggle('hidden',!isAdmin));}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function openAuth(){document.getElementById('authBox').classList.remove('hidden')}function closeAuth(){document.getElementById('authBox').classList.add('hidden')}
async function login(){const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){document.getElementById('authError').textContent='Email o password non corretti.';return}await checkAdmin();closeAuth()}
async function checkAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user){isAdmin=false;document.getElementById('adminBar').classList.add('hidden');document.getElementById('authBtn').classList.remove('hidden');render();return}const {data}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();isAdmin=!!data;if(isAdmin){document.getElementById('adminBar').classList.remove('hidden');document.getElementById('authBtn').classList.add('hidden')}else{await sb.auth.signOut();isAdmin=false;document.getElementById('authError').textContent='Account non autorizzato come amministratore.'}render()}
async function logout(){await sb.auth.signOut();isAdmin=false;document.getElementById('adminBar').classList.add('hidden');document.getElementById('authBtn').classList.remove('hidden');render()}
async function updatePoints(playerId,tournamentId,value){if(!isAdmin)return;const points=Number(value);if(!Number.isFinite(points)||points<0){alert('Inserire un numero valido.');await load();return}const {error}=await sb.from('tournament_results').upsert({tournament_id:tournamentId,player_id:playerId,points},{onConflict:'tournament_id,player_id'});if(error){alert('Errore nel salvataggio: '+error.message);return}await load()}
async function editPlayer(id){if(!isAdmin)return;const p=players.find(x=>x.id===id);const name=prompt('Nuovo nome giocatore:',p.name);if(name===null||!name.trim())return;const {error}=await sb.from('players').update({name:name.trim()}).eq('id',id);if(error){alert('Errore: '+error.message);return}await load()}
load();
</script></body></html>
