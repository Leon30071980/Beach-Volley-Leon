<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torneo Beach Volley Leon — v2.1</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
/* Torneo Beach Volley Leon · v2.1 · Nuova identità sportiva */
:root{
  color-scheme:dark;
  --bg:#031820;--card:#062c35;--card-strong:#073942;
  --ink:#f0fbfd;--mut:#9cc4cc;--line:#17616d;
  --a:#ffc956;--b:#0ad8dc;--a-muted:#453914;--b-muted:#09505a;
  --male:#80caff;--female:#ff9fc9;
  --f:'Exo 2',system-ui,sans-serif;
  box-sizing:border-box;
}
html{scroll-behavior:smooth;scroll-padding-top:150px}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(ellipse 700px 560px at 93% 18%,rgba(14,126,143,.41),transparent 77%),
    radial-gradient(ellipse 720px 530px at -4% 69%,rgba(9,90,107,.34),transparent 73%),
    linear-gradient(115deg,#031b24 0%,#043441 54%,#062731 100%);
  color:var(--ink);font:500 15px/1.55 var(--f);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
body::after{content:'';position:fixed;inset:auto 0 0;height:15vh;pointer-events:none;z-index:0;
  background:linear-gradient(transparent,rgba(252,196,99,.055));}
.scene-art{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.45}
.scene-art svg{width:100%;height:100%;object-fit:cover}
header,main,.login-overlay{position:relative;z-index:1}
h1,h2,h3{font-family:var(--f);letter-spacing:-.018em;margin:0;line-height:1.18}
h1{font-weight:900;font-size:clamp(20px,2.75vw,33px);letter-spacing:-.035em}
h2{font-size:22px;font-weight:800;margin:0 0 12px}
h3{font-size:17px;font-weight:800;margin:0 0 8px}
p{margin:8px 0 12px}
.site-header{position:sticky;top:0;z-index:12;background:rgba(3,22,30,.93);border-bottom:1px solid #127483;
  box-shadow:0 13px 32px #01151d50;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:calc(10px + env(safe-area-inset-top,0px)) 18px 0}
.site-header::before{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#055e68,transparent 40%,#0bbbc8 72%,transparent);pointer-events:none}
.in{max-width:1220px;margin:0 auto}
.masthead{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:4px 0 11px}
.brand-lockup{display:flex;align-items:center;gap:14px;min-width:0}
.volley-logo{width:57px;height:57px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  font-size:38px;filter:drop-shadow(0 3px 7px #030f1680);background:radial-gradient(circle at 37% 28%,#148e9a,#034050);
  border:2px solid #23c6cd;box-shadow:inset 0 0 15px #01161a,0 0 18px #0bc9cc20}
.volley-mark{width:50px;height:50px;display:block}
.brand-copy{min-width:0;padding-left:14px;border-left:2px solid #80bdc499}
.brand-accent{color:#14e5d9}
.app-version{font-size:12px;color:#a4cdd5;margin-top:2px;line-height:1.3;font-weight:500;font-style:italic}
.account-bar{display:flex;align-items:center;justify-content:flex-end;gap:14px;flex-wrap:wrap}
.pill{font-size:12px;color:#a9d9e2;font-weight:600}
#st{display:inline-flex;align-items:center;gap:7px}
#st::before{content:'';width:7px;height:7px;border-radius:50%;background:#20d7cf;box-shadow:0 0 9px #20d7cf}
nav{display:flex;gap:5px;overflow-x:auto;scrollbar-width:thin;margin:0 -3px;padding:0 3px 7px}
nav button{display:inline-flex;align-items:center;gap:9px;border:1px solid transparent;background:transparent;
  border-bottom:3px solid transparent;border-radius:9px 9px 0 0;
  font:700 14px var(--f);color:#b6d4d8;cursor:pointer;padding:11px 17px;
  white-space:nowrap;transition:color .18s,background .18s,border .18s}
nav button svg{width:17px;height:17px;flex-shrink:0;stroke-width:2.15}
nav button:hover{color:white;background:#0c4652}
nav button.on{color:#fff;background:linear-gradient(145deg,#0bd5d2,#087d8c);border-color:#32f6e6;
  box-shadow:inset 0 1px 0 #6cf9f3,0 6px 20px #04bbb92a}
main{max-width:1220px;margin:0 auto;padding:27px 18px 72px;min-height:70vh}
.card{background:linear-gradient(132deg,rgba(7,56,66,.97),rgba(3,36,46,.98));
  border:1px solid #137481;border-radius:16px;padding:21px 24px;margin:0 0 16px;
  box-shadow:0 15px 36px #00131c61,inset 0 1px 0 #61d9e018;overflow-x:auto}
.card h2{color:#f3fcfd}
.mut{color:var(--mut);font-size:13px;margin:5px 0 11px}
.section-heading{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.section-heading h2{margin:0;font-size:25px;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.015em}
.section-heading .section-label{background:#095965;border:1px solid #16b2c0;border-radius:999px;color:#a9fafa;padding:4px 11px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.section-lead{font-size:14px;color:#c3e1e6;margin:0 0 19px}
.eyebrow{font-size:12px;letter-spacing:.11em;color:#3ae4df;font-weight:800;text-transform:uppercase}
.table-scroll{max-width:100%;overflow-x:auto;scrollbar-color:#258995 #062f38}
table{width:100%;border-collapse:separate;border-spacing:0;line-height:1.4}
th,td{padding:10px 11px;text-align:left;border-bottom:1px solid #155663;font-size:14px;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#b5e1e8;background:#075462;font-weight:800;white-space:nowrap}
tr:first-child th:first-child{border-radius:8px 0 0 0}tr:first-child th:last-child{border-radius:0 8px 0 0}
td{color:#e6f8fa;background:rgba(1,40,49,.47)}
tr:nth-child(2n+1) td{background:rgba(11,66,75,.48)}
tr:hover td{background:rgba(13,101,108,.52)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.lead td{font-weight:800}
.rank-table tr.rank-winner td{background:linear-gradient(90deg,#594c18c9,#383a1baf)!important;color:#fff4ce;
  border-top:1px solid #d2af43;border-bottom:1px solid #d2af43}
.rank-table tr.rank-winner td:first-child{border-left:2px solid #e5bc51;border-radius:8px 0 0 8px}
.rank-table tr.rank-winner td:last-child{border-right:2px solid #e5bc51;border-radius:0 8px 8px 0}
.rank-table tr.rank-spoon td{background:linear-gradient(90deg,#4d3024e6,#442a22aa)!important;color:#ffddc8;
  border-top:1px solid #d18d68;border-bottom:1px solid #d18d68}
.rank-table tr.rank-spoon td:first-child{border-left:2px solid #c48262;border-radius:8px 0 0 8px}
.rank-table tr.rank-spoon td:last-child{border-right:2px solid #c48262;border-radius:0 8px 8px 0}
.rank-symbol{font-size:19px;vertical-align:-2px;display:inline-block;margin-left:6px}
.rank-symbol svg{vertical-align:-3px;width:19px!important;height:19px!important}
.rank-pos{display:inline-grid;place-items:center;min-width:26px;min-height:25px;padding:2px 5px;border-radius:6px;font-weight:900;color:#dbf9fa;background:#165865}
.rank-winner .rank-pos{background:linear-gradient(135deg,#ffe381,#eaa71d);color:#4d3000}
.rank-spoon .rank-pos{background:linear-gradient(135deg,#e2b28b,#9f5d37);color:#36170e}
input,select{font:600 14px var(--f);color:#f5fdff;background:#022b34;border:1px solid #2a7280;border-radius:9px;
  padding:9px 10px;width:100%;min-width:85px;outline-offset:2px}
input:focus,select:focus{outline:2px solid #40e7e2;border-color:#43e6e5}
input::placeholder{color:#8aaeb7;opacity:1}
input:disabled,select:disabled{opacity:.67;cursor:not-allowed}
select{min-width:65px;cursor:pointer}
input[type=number]{width:69px;min-width:0;text-align:center;font-variant-numeric:tabular-nums}
.sc input[type=number]{-moz-appearance:textfield;appearance:textfield}
.sc input[type=number]::-webkit-inner-spin-button,.sc input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=checkbox]{accent-color:#18d1d3;cursor:pointer}
.p,.s{border-radius:10px;font:800 14px var(--f);cursor:pointer;padding:11px 19px;min-height:41px;
  transition:transform .14s,background .14s,box-shadow .14s;white-space:normal}
.p{background:linear-gradient(135deg,#13e4d5,#078ba0);color:#06232a;border:1px solid #2ce8e2;
  box-shadow:inset 0 1px 0 #90ffff8f,0 7px 16px #03b7ba25}
.s{background:#07313b;border:1px solid #237d89;color:#d9f5f8}
.p:not(:disabled):hover,.s:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 7px 17px #00192070}
.s:not(:disabled):hover{background:#09505e}
.p:disabled,.s:disabled{opacity:.44;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:center}
.bd{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font:800 12px var(--f);
  color:#322007;margin-right:7px;vertical-align:1px;font-style:normal}
.bd.A{background:linear-gradient(140deg,#ffdf86,#f3a72a)}
.bd.B{background:linear-gradient(140deg,#25d9e0,#077c99);color:#fff}
.sexname.M{color:var(--male);font-weight:800}.sexname.F{color:var(--female);font-weight:800}
.sortbtn{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:inherit;cursor:pointer;white-space:nowrap;text-transform:inherit;letter-spacing:inherit}
.sortbtn::after{content:' ↕';font-size:11px;opacity:.57}.sortbtn.up::after{content:' ↑';opacity:1}.sortbtn.down::after{content:' ↓';opacity:1}
.m{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.t{display:flex;flex-direction:column;gap:7px;font-size:15px;font-weight:700}
.t>span{line-height:1.4}
.sc{display:flex;gap:9px;align-items:center;justify-content:center;white-space:nowrap;font-size:23px;font-weight:900;color:#a6faff;font-variant-numeric:tabular-nums}
.sc input{width:66px;height:47px;font-size:20px;font-weight:900;border-color:#3693a0;background:#06303a}
.seg{display:flex;gap:5px}.seg button{width:42px;height:36px;border:1px solid var(--line);background:#073843;border-radius:8px;color:var(--ink);font:800 14px var(--f);cursor:pointer}
.seg .A.on{background:var(--a);border-color:var(--a);color:#0b2a33}.seg .B.on{background:var(--b);border-color:var(--b);color:#002934}
.updateplus{color:#71eee1;font-weight:900;white-space:nowrap}.updateneg{color:#ffadca;font-weight:900;white-space:nowrap}
.previewbox{border:1px solid #238d99;border-radius:12px;padding:10px;margin-top:14px;overflow-x:auto;background:#062932}
.public{display:inline-flex;align-items:center;gap:7px}
.x{background:none;border:0;color:#bbd5da;cursor:pointer;font-size:18px}
.user-hidden{display:none!important}
/* Classifica finale: premi, podio, tabellone */
.final-heading{position:relative;text-align:center;padding:13px 10px 22px}
.final-heading .finished-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid #20c7d6;
  border-radius:9px;padding:5px 19px;color:#9ffff7;background:linear-gradient(160deg,#0b6976,#07505f);
  box-shadow:0 0 12px #08abb120;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.final-heading h2{font-size:clamp(26px,3.9vw,41px);font-style:italic;font-weight:900;text-transform:uppercase;
  letter-spacing:.02em;margin:10px 0 0;text-shadow:0 4px 13px #001c23}
.award-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0 0 19px}
.award-card{display:flex;align-items:center;gap:18px;min-height:135px;border-radius:15px;overflow:hidden;
  padding:20px 23px;position:relative;box-shadow:0 12px 29px #00161e80}
.award-card::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(125deg,transparent 0,transparent 25px,#ffffff09 26px,transparent 27px)}
.award-card.champion{border:2px solid #e6b837;background:radial-gradient(circle at 15% 50%,#9c741e7a,transparent 42%),linear-gradient(115deg,#433919,#242f25 69%,#89691550)}
.award-card.spoon{border:2px solid #b77c61;background:radial-gradient(circle at 18% 50%,#a36e485c,transparent 46%),linear-gradient(115deg,#442d23,#2a2424 70%,#8e543d55)}
.award-icon{flex:0 0 78px;display:grid;place-items:center;filter:drop-shadow(0 5px 11px #050a0d99)}
.award-icon svg{width:75px;height:75px;display:block}
.award-info{position:relative;z-index:1;min-width:0}
.award-label{font-size:clamp(12px,1.6vw,18px);font-weight:900;letter-spacing:.055em;text-transform:uppercase;line-height:1.25}
.champion .award-label{color:#ffdc78}.spoon .award-label{color:#f0bf9b}
.award-name{font-size:clamp(18px,2.2vw,29px);font-weight:900;font-style:italic;line-height:1.17;margin-top:7px;
  letter-spacing:-.02em;overflow-wrap:anywhere;color:#fff}
.final-board{padding:20px 20px 24px;border-color:#0fb0b9}
.board-header{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;margin:0 0 15px}
.board-header h2{font-style:italic;font-weight:900;margin:0;text-transform:uppercase}
.stats-pill{border:1px solid #0a9caa;border-radius:999px;background:#064b57;color:#80f5ef;padding:5px 12px;font-size:11px;font-weight:800}
.rank-table{min-width:500px}
.rank-table th{background:#07505d}
.rank-table td{padding:10px 12px}
.rank-table .player-col{min-width:190px}
.rank-points{font-weight:900;font-size:18px;color:#f6ce6c}
.progress-summary{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  color:#b5dae1;font-size:13px;font-weight:700;margin:0 0 14px}
.progress-track{height:7px;border-radius:99px;background:#0a4651;overflow:hidden;border:1px solid #246c75;margin-bottom:15px}
.progress-track .progress-fill{height:100%;background:linear-gradient(90deg,#05a8b2,#24e7d8);border-radius:99px}
/* Selezione e gruppi */
.groups-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.group-panel{border:1px solid #257b84;border-radius:12px;background:#082e38;padding:15px;min-width:0}
.group-panel .group-title{display:flex;align-items:center;font-size:16px;margin-bottom:12px;font-weight:900}
.group-panel table{font-size:13px}
.group-panel td,.group-panel th{padding:8px 7px}
.group-panel table{min-width:320px}
.group-table-wrap{overflow-x:auto;max-width:100%}
.groups-ready{border-color:#11b9bc;background:linear-gradient(135deg,#073e47,#062b36)}
.groups-ready .group-actions{padding-top:6px;margin-bottom:0}
.groups-ready .group-actions .p{font-size:15px;padding:13px 24px}
.select-progress{height:8px;max-width:460px;border:1px solid #337983;border-radius:30px;overflow:hidden;background:#07343e;margin:10px 0 15px}
.select-progress>span{display:block;height:100%;background:linear-gradient(90deg,#09a9b8,#11e1d2);border-radius:30px}
.mode-buttons .p,.mode-buttons .s{flex:0 1 auto}
/* Scorecard dei turni */
.round-header{margin:28px 0 12px!important;font-size:23px;font-style:italic;font-weight:900;text-transform:uppercase;color:#e9fbff}
.round-header::before{content:'◆';color:#07cbd3;margin-right:11px;font-size:13px;vertical-align:3px}
.match-card{border-color:#177482;background:linear-gradient(135deg,rgba(7,61,70,.96),rgba(3,35,44,.96));padding:18px 24px}
.match-label{display:flex;align-items:center;gap:8px;text-transform:uppercase;font-size:11px;letter-spacing:.07em;font-weight:800;color:#74e9e4;margin:0 0 14px}
.match-label::before{content:'';display:block;width:6px;height:6px;background:#00d7d8;border-radius:50%;box-shadow:0 0 7px #00d7d8}
.match-card .t{font-size:16px;gap:9px}
.match-card .mut:last-child{margin-top:13px;margin-bottom:0}
.match-card .tie-msg{color:#ffbea2}
/* Classifica generale e storico */
.general-table{min-width:870px}
.general-table input{font-size:13px;padding:8px 8px}
.general-table input[type=number]{width:74px}
.general-table input.sexname{font-weight:800}
.general-table th{padding:10px 8px}
.general-table td{padding:7px 5px}
.history-entry{background:linear-gradient(135deg,#073c46,#062934);border:1px solid #217b85;border-radius:14px;
  margin:0 0 16px;overflow:hidden;box-shadow:0 10px 25px #001a2069}
.history-entry>summary{padding:18px 21px;cursor:pointer;list-style-position:inside;font-size:16px;line-height:1.55}
.history-entry>summary::marker{color:#3de8db}
.history-entry>summary:hover{background:#0a505a}
.history-entry[open]>summary{border-bottom:1px solid #176877}
.history-inner{padding:19px}
.history-inner .card{margin-top:10px}
.history-inner .sc{white-space:nowrap;font-variant-numeric:tabular-nums}
.history-entry summary .mut{display:inline}
.history-entry summary .history-small{display:block;margin:5px 0 0}
.history-inner .award-grid{margin-top:12px}
.history-inner .award-card{min-height:110px}
.history-inner .award-name{font-size:19px}
/* Login e focus */
.login-overlay{position:fixed;inset:0;z-index:30;background:#00151ce0;display:none;align-items:center;justify-content:center;padding:18px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.login-overlay.open{display:flex}
.login-card{width:100%;max-width:420px;background:linear-gradient(135deg,#073d46,#031f29);color:var(--ink);
  border:1px solid #1cc4c8;border-radius:18px;padding:25px;box-shadow:0 22px 65px #000b}
.login-card h2{font-size:23px;font-weight:900;font-style:italic}
.login-card label{display:block;font-weight:800;color:#caeaf0;margin:13px 0 6px}
.login-card input{min-width:0;padding:12px}
.login-card .row button{flex:1}
:focus-visible{outline:2px solid #50fff1;outline-offset:3px}
@media(max-width:920px){
  .account-bar{gap:8px;align-items:flex-end}nav button{padding:10px 12px}
  main{padding:21px 14px 65px}
  .card{padding:17px}
  .award-card{min-height:120px;padding:17px;gap:12px}
  .award-icon{flex-basis:61px}.award-icon svg{width:60px;height:60px}
}
@media(max-width:670px){
  .site-header{padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0}
  .masthead{align-items:flex-start;gap:7px;padding-bottom:9px}
  .brand-lockup{gap:8px;align-items:center}
  .brand-copy{padding-left:9px}
  .volley-logo{width:39px;height:39px;font-size:26px;border-width:1px}.volley-mark{width:36px;height:36px}
  h1{font-size:clamp(16px,4.6vw,23px)}
  .app-version{font-size:10px}
  .account-bar{flex-direction:column;gap:4px;align-items:flex-end}
  #st{font-size:10px;max-width:125px;text-align:right}
  .account-bar .s{min-height:30px;padding:5px 10px;font-size:11px}
  nav{gap:2px;padding-bottom:4px}nav button{font-size:12px;padding:9px 10px;gap:5px}nav button svg{width:15px;height:15px}
  main{padding:17px 10px 60px}
  h2{font-size:19px}.section-heading h2{font-size:22px}
  .award-grid{grid-template-columns:1fr;gap:10px}
  .award-card{min-height:97px;padding:14px 17px}
  .award-icon{flex:0 0 58px}.award-icon svg{width:57px;height:57px}
  .award-label{font-size:12px}.award-name{font-size:21px}
  .groups-grid{grid-template-columns:1fr}
  .m{gap:6px}
  .match-card{padding:14px 11px}
  .match-card .t{font-size:12px;gap:5px}
  .match-card .bd{width:18px;height:18px;margin-right:2px;font-size:10px}
  .match-card .sc{gap:3px;font-size:15px}
  .match-card .sc input{width:46px;min-width:0;padding:5px 3px;height:41px;font-size:16px}
  .final-board{padding:13px 11px}
  .section-heading{gap:7px}
  .card{border-radius:12px;padding:14px}
  th,td{padding:8px 7px}

  .rank-table{width:100%;min-width:0;table-layout:auto}
  .rank-table th,.rank-table td{padding:9px 4px;font-size:11px}
  .rank-table th:nth-child(4),.rank-table td:nth-child(4){display:none}
  .rank-table .player-col{min-width:0;max-width:185px;white-space:nowrap}
  .rank-table .rank-pos{min-width:20px;min-height:23px;padding:2px 4px}
  .rank-table .bd{width:19px;height:19px;font-size:10px;margin-right:4px}
  .rank-table .rank-symbol{margin-left:2px}
  .rank-table .rank-symbol svg{width:16px!important;height:16px!important}
  .rank-table .rank-points{font-size:14px}

}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}

  return `${complete?`<div class="final-heading"><span class="finished-badge">⚑ Torneo concluso</span><h2>Classifica finale</h2></div>${award}`:`<div class="section-heading"><h2>Classifica live</h2><span class="section-label">Turno ${T.rounds.length} di 5</span></div><div class="progress-summary"><span>Partite completate nel turno</span><span>${last.matches.filter(done).length} / ${last.matches.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>`}
  <div class="card final-board"><div class="board-header"><h2>${complete?'Classifica definitiva':'Classifica del torneo'}</h2><span class="stats-pill">${T.players} giocatori · ${T.mode} campi</span></div>
  <div class="table-scroll"><table class="rank-table"><tr><th>#</th><th>Giocatore</th><th class="n">Punti</th><th class="n">G</th><th class="n">V</th><th class="n">Diff.</th></tr>${rows}</table></div></div>
  <p class="mut">Vittoria: 3 punti · sconfitta con almeno 20 punti fatti: 1 punto · sotto 20: 0 punti. A parità: differenza punti e poi punti fatti.</p>
  ${complete&&!T.applied?`<div class="row"><button class="p public" onclick="go('aggiorna')">🏆 Aggiorna classifica generale</button></div>`:complete&&T.applied?`<div class="card"><b>✓ Torneo approvato e archiviato nello Storico.</b></div>`:''}`;
}

const team=(T,r,tm)=>`<div class="t">${tm.map(id=>{const g=r.finals?'':r.A.includes(id)?'A':'B';const p=S.players.find(x=>x.id==id);const sex=p?.s=='F'?'F':'M';return `<span>${g?`<i class="bd ${g}">${g}</i>`:""}<span class="sexname ${sex}">${esc(T.names[id])}</span></span>`}).join('')}</div>`;
function turni(){
 const T=S.T;if(!T)return none();
 const C=cfg(),n=T.rounds.length,last=T.rounds[n-1],ld=last.matches.every(done);
 let ctl=n<5?`<button class="p" ${ld?'':'disabled'} onclick="nxt()">Genera turno ${n+1} →</button>`:ld?(T.applied?`<span class="stats-pill">✓ Torneo archiviato</span>`:''):'';
 const body=T.rounds.map((r,i)=>`<h2 class="round-header">${r.finals?'Finali · 5° turno':'Turno '+(i+1)}</h2>`+
 r.matches.map((m,k)=>{
  const lk=(i<n-1||T.applied)?'disabled':'',d=done(m),tie=m.s1!==''&&m.s2!==''&&+m.s1===+m.s2;
  return `<div class="card match-card"><div class="match-label">${r.finals?`${k+1}ª finale · ${k*4+1}°–${k*4+4}° posto dopo 4 turni`:'Campo '+(k+1)}</div><div class="m">${team(T,r,m.t1)}<div class="sc"><input type="number" min="0" inputmode="numeric" value="${m.s1}" ${lk} aria-label="Punti squadra 1" onchange="sc(${i},${k},'s1',this.value)"><span>:</span><input type="number" min="0" inputmode="numeric" value="${m.s2}" ${lk} aria-label="Punti squadra 2" onchange="sc(${i},${k},'s2',this.value)"></div>${team(T,r,m.t2)}</div>${tie?'<div class="mut tie-msg">Il pareggio non è ammesso: correggi il punteggio.</div>':''}${d?`<div class="mut">Vincitori 3 pt · sconfitti ${Math.min(+m.s1,+m.s2)>=20?1:0} pt</div>`:''}</div>`;
 }).join('')).reverse();
 return `<div class="section-heading"><h2>Turni di gioco</h2><span class="section-label">${C.mode} campi · ${C.players} giocatori</span></div><p class="section-lead">5 turni. ${T.mode===3?'Quinto turno: tre finali basate sulla classifica dopo quattro turni.':'Abbinamenti A+B con compagni diversi quando possibile.'}</p><div class="row">${ctl}</div>`+body.join('');
}

const split=()=>{const C=cfg(),ids=S.players.filter(p=>S.sel[p.id]).sort((a,b)=>med(b)-med(a)).map(p=>p.id);return{A:ids.slice(0,C.group),B:ids.slice(C.group,C.group*2)}};
function gruppi(){
 const C=cfg(),P=sortedPlayers('gruppi'),n=P.filter(p=>S.sel[p.id]).length,ok=n===C.players,g=ok?split():null;
 const col=(L,ids)=>`<div class="group-panel"><div class="group-title"><i class="bd ${L}">${L}</i>Gruppo ${L}</div><div class="group-table-wrap"><table><tr>${th('gruppi','Nome','n')}${th('gruppi','Cognome','c')}${th('gruppi','Tornei','t','n')}${th('gruppi','Media','med','n')}</tr>${ids.map(id=>{const p=S.players.find(x=>x.id===id);return `<tr><td><span class="sexname ${p.s==='F'?'F':'M'}">${esc(p.n)}</span></td><td><span class="sexname ${p.s==='F'?'F':'M'}">${esc(p.c)}</span></td><td class="n">${p.t||0}</td><td class="n">${med(p).toFixed(2)}</td></tr>`}).join('')}</table></div></div>`;
 const riepilogo=ok?`<div class="card groups-ready"><div class="section-heading"><h2>Squadre pronte!</h2><span class="section-label">${n} selezionati</span></div><p class="section-lead">Ecco i gruppi A e B divisi in base alla media. Sono pronti per il primo sorteggio.</p><div class="groups-grid">${col('A',g.A)}${col('B',g.B)}</div><div class="row group-actions"><button class="p" onclick="start()">🏐 Avvia torneo →</button></div></div>`:'';
 return `<div class="section-heading"><h2>Gruppi e giocatori</h2><span class="section-label">${C.mode} campi</span></div>${riepilogo}
 <div class="card"><h2>Modalità torneo</h2><p class="section-lead">Scelga quanti campi utilizzare.</p><div class="row mode-buttons"><button class="${C.mode===2?'p':'s'}" onclick="setMode(2)">2 campi · 8 giocatori</button><button class="${C.mode===3?'p':'s'}" onclick="setMode(3)">3 campi · 12 giocatori</button>${S.T?'<button class="s" onclick="resetTournament()">Azzera torneo</button>':''}</div>${S.T?'<p class="mut">È già presente un torneo in corso. Cambiando modalità verrà chiesto di confermare l’azzeramento.</p>':''}</div>
 <div class="card"><div class="section-heading"><h2>Seleziona i partecipanti</h2><span class="section-label">${n}/${C.players}</span></div><p class="section-lead">Selezioni ${C.players} giocatori della Classifica Generale. I ${C.group} con la media più alta entreranno nel gruppo A e gli altri nel gruppo B.</p><div class="select-progress"><span style="width:${100*n/C.players}%"></span></div><div class="row"><button class="s" onclick="selTop()">Seleziona i primi ${C.players}</button><button class="s" onclick="S.sel={};save();R()">Azzera selezione</button></div>${P.length<C.players?`<p class="mut">Servono almeno ${C.players} giocatori nella Classifica Generale.</p>`:''}<div class="table-scroll"><table><tr><th style="width:40px">✓</th>${th('gruppi','Nome','n')}${th('gruppi','Cognome','c')}${th('gruppi','Sesso','s')}${th('gruppi','Tornei','t','n')}${th('gruppi','Media','med','n')}</tr>${P.map(p=>`<tr><td style="width:40px"><input type="checkbox" style="width:20px;height:20px;min-width:0" aria-label="Seleziona ${esc(p.n)} ${esc(p.c)}" ${S.sel[p.id]?'checked':''} ${!S.sel[p.id]&&n>=C.players?'disabled':''} onchange="tg('${p.id}')"></td><td><span class="sexname ${p.s==='F'?'F':'M'}">${esc(p.n)}</span></td><td><span class="sexname ${p.s==='F'?'F':'M'}">${esc(p.c)}</span></td><td>${p.s||'M'}</td><td class="n">${p.t||0}</td><td class="n">${med(p).toFixed(2)}</td></tr>`).join('')}</table></div></div>`;
}

function awardPair(champion,spoon){

function generale(){
 const P=sortedPlayers('generale'),I=(id,f,v,t)=>`<input class="sexname ${S.players.find(x=>x.id==id)?.s==='F'?'F':'M'}" ${t||''} value="${esc(v)}" onchange="ed('${id}','${f}',this.value)">`,Sel=(id,v)=>`<select onchange="ed('${id}','s',this.value)"><option value="M" ${v==='M'?'selected':''}>M</option><option value="F" ${v==='F'?'selected':''}>F</option></select>`;
 return `<div class="section-heading"><h2>Classifica Generale</h2><span class="section-label">${P.length} giocatori</span></div>
 <div class="card"><p class="section-lead">Classifica basata sulla media punti per torneo. L'ADMIN può modificare i valori, aggiungere giocatori e ordinare le colonne.</p><div class="table-scroll"><table class="general-table"><tr><th>#</th>${th('generale','Nome','n')}${th('generale','Cognome','c')}${th('generale','Sesso','s')}${th('generale','Punti','tot','n')}${th('generale','Tornei','t','n')}${th('generale','Media','med','n')}${th('generale','🏆 Vinti','vinti','n')}${th('generale',WOODEN_SPOON+' Ultimo','ultimo','n')}<th></th></tr>${P.map((p,i)=>`<tr><td><span class="rank-pos">${i+1}</span></td><td>${I(p.id,'n',p.n)}</td><td>${I(p.id,'c',p.c)}</td><td>${Sel(p.id,p.s||'M')}</td><td>${I(p.id,'tot',p.tot,'type="number" min="0"')}</td><td>${I(p.id,'t',p.t,'type="number" min="0"')}</td><td class="n"><b>${med(p).toFixed(2)}</b></td><td>${I(p.id,'vinti',p.vinti,'type="number" min="0" step="1" aria-label="Tornei vinti"')}</td><td>${I(p.id,'ultimo',p.ultimo,'type="number" min="0" step="1" aria-label="Ultimi posti"')}</td><td class="adm"><button class="x" aria-label="Elimina" onclick="del('${p.id}')">✕</button></td></tr>`).join('')}</table></div></div>
 <div class="card adm"><h2>Gestione giocatori</h2><div class="row"><input id="nn" placeholder="Nome" style="flex:1"><input id="nc" placeholder="Cognome" style="flex:1"><select id="ns" style="width:auto"><option value="M">M</option><option value="F">F</option></select><button class="p" onclick="add()">Aggiungi giocatore</button></div><p class="mut">Media = punti totali ÷ tornei giocati.</p><button class="s" onclick="if(confirm('Eliminare tutti i giocatori e il torneo in corso? I tornei già approvati resteranno nello Storico.')){S={players:[],sel:{},T:null,mode:S.mode,storico:S.storico||[]};save();R()}">Svuota tutto</button></div>`;
}

function ed(id,f,v){const p=S.players.find(x=>x.id==id);p[f]=(f=='n'||f=='c'||f=='s')?v.trim():(f==='vinti'||f==='ultimo'?Math.max(0,Math.trunc(Number(v)||0)):Math.max(0,+v||0));save();R()}
function del(id){S.players=S.players.filter(x=>x.id!=id);delete S.sel[id];save();R()}
function add(){const n=nn.value.trim(),c=nc.value.trim(),s=ns.value;if(!n)return;S.players.push({id:'p'+Date.now().toString(36),n,c,s,tot:0,t:0,vinti:0,ultimo:0});save();R()}
function tg(id){if(S.sel[id])delete S.sel[id];else if(Object.keys(S.sel).length<cfg().players)S.sel[id]=1;save();R()}
function selTop(){S.sel={};[...S.players].sort((a,b)=>med(b)-med(a)).slice(0,cfg().players).forEach(p=>S.sel[p.id]=1);save();R()}
function start(){if(S.T&&!confirm('Il torneo in corso verrà azzerato. Continuare?'))return;const g=split(),names={},grp={};g.A.forEach(id=>grp[id]='A');g.B.forEach(id=>grp[id]='B');S.players.forEach(p=>{if(grp[p.id])names[p.id]=p.n+' '+(p.c||'').charAt(0)+'.'});
S.T={id:'torneo-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),startedAt:new Date().toISOString(),mode:S.mode,players:S.mode==2?8:12,names,grp,applied:false,rounds:[mk(g.A,g.B,new Set())]};save();go('turni')}
function sc(i,k,f,v){
  if(!S.T || S.T.applied)return;
  if(v===''){
    S.T.rounds[i].matches[k][f]='';
  }else{
    const n=Number(v);
    S.T.rounds[i].matches[k][f]=Number.isFinite(n)?Math.max(0,Math.floor(n)):'';
  }
  save();
  if(S.T.rounds.length===5 && S.T.rounds[4].matches.every(done)){ S.T.review='pending'; save(); go('live'); return; }
  R();
}
function nxt(){
  const T=S.T;if(!T || T.applied)return;const last=T.rounds[T.rounds.length-1];
  if(!last.matches.every(done))return;
  const W=[],L=[];
  if(T.rounds.length!==4 || T.mode!==3){
    last.matches.forEach(m=>{
      const w=+m.s1>+m.s2;
      (w?m.t1:m.t2).forEach(x=>W.push(x));
      (w?m.t2:m.t1).forEach(x=>L.push(x));
    });
  }
  try{
    T.rounds.push(T.rounds.length===4 && T.mode===3 ? mkFinals() : mk(W,L,used(T)));
    save();
    R();
  }catch(e){
    setSt('Errore generazione turno: '+e.message,true);
  }
}
// Una fotografia completa del torneo: indipendente dai successivi cambi di nome,
// sesso, punteggio o cancellazione dei giocatori dalla Classifica Generale.
function archiveTournament(T,ranking,approvedAt){
  const snapshotPlayers={};
  Object.keys(T.names).forEach(id=>{
    const p=S.players.find(x=>x.id===id);
    snapshotPlayers[id]={name:p?`${p.n} ${p.c||''}`.trim():T.names[id],sex:p?.s==='F'?'F':'M'};
  });
  return {
    id:T.id||'torneo-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),
    startedAt:T.startedAt||approvedAt,
    approvedAt,
    mode:T.mode,
    players:snapshotPlayers,
    ranking:ranking.map(x=>({...x})),
    rounds:JSON.parse(JSON.stringify(T.rounds))
  };
}
function historyDate(value){
  const d=new Date(value);
  return !value||Number.isNaN(d.getTime())?'Data non disponibile':
    new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'long',year:'numeric',timeZone:'Europe/Rome'}).format(d);
}
function storico(){
 const list=[...(S.storico||[])].sort((a,b)=>String(b.approvedAt||b.startedAt||'').localeCompare(String(a.approvedAt||a.startedAt||'')));
 if(!list.length)return `<div class="section-heading"><h2>Storico tornei</h2></div><div class="card"><p class="section-lead">Nessun torneo archiviato. Quando l'ADMIN approva l'aggiornamento della Classifica Generale, vengono salvati data, classifica finale e tutti i turni.</p></div>`;
 const player=(h,id)=>{const p=h.players?.[id]||{};return `<span class="sexname ${p.sex==='F'?'F':'M'}">${esc(p.name||id)}</span>`};
 const full=(h,id)=>h.players?.[id]?.name||id;
 const pair=(h,ids)=>`<div class="t">${ids.map(id=>`<span>${player(h,id)}</span>`).join('')}</div>`;
 const card=h=>{
   const rank=h.ranking||[],rounds=h.rounds||[],first=rank[0],last=rank[rank.length-1];
   const trophy=first&&last?awardPair(full(h,first.id),full(h,last.id)):'';
   const rankTable=`<div class="card final-board"><div class="board-header"><h2>Classifica finale</h2><span class="stats-pill">${rank.length} giocatori</span></div><div class="table-scroll"><table class="rank-table"><tr><th>#</th><th>Giocatore</th><th class="n">Pt</th><th class="n">G</th><th class="n">V</th><th class="n">Diff</th><th class="n">PF</th></tr>${rank.map((x,i)=>`<tr class="${i===0?'rank-winner':i===rank.length-1?'rank-spoon':''}"><td><span class="rank-pos">${i+1}</span>${i===0?`<span class="rank-symbol">${CROWN_BIG}</span>`:i===rank.length-1?`<span class="rank-symbol">${WOODEN_SPOON}</span>`:''}</td><td class="player-col">${player(h,x.id)}</td><td class="n rank-points">${x.pt}</td><td class="n">${x.g}</td><td class="n">${x.w}</td><td class="n">${x.pf-x.ps}</td><td class="n">${x.pf}</td></tr>`).join('')}</table></div></div>`;
   const games=rounds.map((r,i)=>`<h2 class="round-header">${r.finals?'Finali · 5° turno':'Turno '+(i+1)}</h2>${(r.matches||[]).map((m,k)=>`<div class="card match-card"><p class="match-label">${r.finals?`${k+1}ª finale`:`Campo ${k+1}`}</p><div class="m">${pair(h,m.t1)}<div class="sc"><b>${esc(m.s1)} : ${esc(m.s2)}</b></div>${pair(h,m.t2)}</div></div>`).join('')}`).join('');
   return `<details class="history-entry"><summary><b>${historyDate(h.startedAt||h.approvedAt)}</b> <span class="mut">· ${h.mode===2?'2 campi · 8 giocatori':'3 campi · 12 giocatori'}</span><span class="mut history-small">👑 ${first?player(h,first.id):'—'} &nbsp;·&nbsp; ${WOODEN_SPOON} ${last?player(h,last.id):'—'}</span></summary><div class="history-inner"><p class="mut">Confermato dall'ADMIN il ${historyDate(h.approvedAt)} · ${rounds.length} turni salvati</p>${trophy}${rankTable}<h2 class="round-header">Risultati e turni</h2>${games}</div></details>`;
 };
 return `<div class="section-heading"><h2>Storico tornei</h2><span class="section-label">${list.length} archiviati</span></div><p class="section-lead">Selezioni un torneo per consultare classifiche finali, premi e risultati di ogni campo.</p>${list.map(card).join('')}`;
}

function updateRows(){
  const ranking=table();
  return ranking.map((x,index)=>{
    const p=S.players.find(q=>q.id==x.id);
    return {id:x.id,name:p?.n||'',surname:p?.c||'',sex:p?.s||'M',
      oldTot:p?.tot||0,oldT:p?.t||0,addPt:x.pt,addT:1,
      newTot:(p?.tot||0)+x.pt,newT:(p?.t||0)+1,
      newMed:((p?.t||0)+1)?((p?.tot||0)+x.pt)/((p?.t||0)+1):0,
      oldVinti:p?.vinti||0,oldUltimo:p?.ultimo||0,
      addVinti:index===0?1:0,addUltimo:index===ranking.length-1?1:0};
  });
}
function aggiorna(){
  const T=S.T;
  if(!T)return none();
  const last=T.rounds[T.rounds.length-1];
  if(T.rounds.length<5 || !last.matches.every(done))return `<div class="card"><h2>Aggiornamento classifica generale</h2><p>Prima devono essere completati tutti i risultati del quinto turno.</p></div>`;
  if(T.applied)return `<div class="card"><h2>Classifica Generale già aggiornata</h2><p>Questo torneo è già stato contabilizzato.</p></div>`;
  if(T.review==='rejected')return `<div class="card"><h2>Aggiornamento classifica rifiutato</h2><p>La proposta non è stata applicata. È possibile riproporla dalla Classifica live.</p><button class="p" onclick="proponiAggiornamento()">Riproporre aggiornamento</button></div>`;
  const rows=updateRows();
  return `<div class="card"><h2>Aggiorna classifica generale</h2><p>Questa è un'anteprima delle modifiche che verranno applicate. I valori con <b>+</b> indicano ciò che verrà aggiunto alla classifica.</p><div class="previewbox"><table><tr><th>Giocatore</th><th class="n">Punti attuali</th><th class="n">Variazione</th><th class="n">Tornei attuali</th><th class="n">Nuovi tornei</th><th class="n">Nuova media</th><th class="n">🏆 Vinti</th><th class="n">${WOODEN_SPOON} Ultimo</th></tr>${rows.map(r=>`<tr><td><span class="sexname ${r.sex=='F'?'F':'M'}">${esc(r.name)} ${esc(r.surname)}</span></td><td class="n">${r.oldTot}</td><td class="n"><b class="updateplus">+${r.addPt}</b></td><td class="n">${r.oldT}</td><td class="n"><b class="updateplus">+${r.addT}</b></td><td class="n"><b>${r.newMed.toFixed(2)}</b></td><td class="n">${r.oldVinti}${r.addVinti?'<b class="updateplus"> +1</b>':''}</td><td class="n">${r.oldUltimo}${r.addUltimo?'<b class="updateplus"> +1</b>':''}</td></tr>`).join('')}</table></div>${ADMIN?`<div class="row"><button class="p" onclick="confirmUpdate()" ${approving?'disabled':''}>Conferma, aggiorna e salva nello Storico</button><button class="s" onclick="rejectUpdate()">Rifiuta proposta</button></div>`:`<p class="mut">Proposta pronta. Solo l'Admin può confermare e applicare queste modifiche.</p>`}</div>`;
}
function rejectUpdate(){
  if(!ADMIN || !S.T || S.T.applied)return;
  if(!confirm('Rifiutare la proposta di aggiornamento della Classifica Generale?'))return;
  S.T.review='rejected';
  save();
  go('live');
}
function proponiAggiornamento(){
  if(!S.T || S.T.applied)return;
  S.T.review='pending';
  save();
  go('aggiorna');
}
let approving=false;
async function confirmUpdate(){
  const T=S.T;
  if(approving||!ADMIN||!T||T.applied||T.rounds?.length!==5||!T.rounds[4].matches.every(done))return;
  const rows=updateRows();
  if(!confirm("Confermare la Classifica Generale e archiviare questo torneo con data, classifica finale e tutti i turni?"))return;
  approving=true;
  const approvedAt=new Date().toISOString();
  const snap=JSON.parse(JSON.stringify(S));
  snap.storico=Array.isArray(snap.storico)?snap.storico:[];
  const archive=archiveTournament(T,table(),approvedAt);
  if(!snap.storico.some(x=>x.id===archive.id))snap.storico.push(archive);
  rows.forEach(r=>{
    const p=snap.players.find(q=>q.id===r.id);
    if(p){p.tot=r.newTot;p.t=r.newT;p.vinti=r.oldVinti+r.addVinti;p.ultimo=r.oldUltimo+r.addUltimo}
  });
  snap.T.applied=true;
  snap.T.review='approved';
  clearTimeout(timer);
  const button=document.querySelector('button[onclick="confirmUpdate()"]');
  if(button){button.disabled=true;button.textContent='Conferma e archiviazione…'}
  setSt('Salvataggio classifica e storico…');
  try{
    // Salva classifica e archivio nella stessa transazione PostgreSQL.
    const operation=q.then(()=>sb.rpc('salva_stato_auth',{p_data:snap}));
    q=operation.then(()=>{}).catch(()=>{});
    const {data,error}=await operation;
    if(error)throw error;
    S=norm(data||snap);
    go('storico');
    setSt('Torneo confermato e salvato nello Storico');
  }catch(err){
    setSt('Errore approvazione: '+(err?.message||'Errore di rete'),true);
    alert('Impossibile salvare la classifica e lo storico. Non è stata confermata alcuna modifica. '+(err?.message||''));
    R();
  }finally{
    approving=false;
  }
}
function applyG(){go('aggiorna')}
init();
</script></body></html>
