<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torneo</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f2;--card:#fff;--ink:#0b2a33;--mut:#5b727a;--line:#d5e0e0;--a:#e8a317;--b:#0f7c8a;--f:Figtree,system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1c21;--card:#12292f;--ink:#e8f1f1;--mut:#8fa8ae;--line:#244047}}
:root[data-theme="dark"]{--bg:#0a1c21;--card:#12292f;--ink:#e8f1f1;--mut:#8fa8ae;--line:#244047}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f)}
h1,h2{font-family:'Bricolage Grotesque',var(--f);letter-spacing:-.02em;margin:0}
h1{font-size:28px;font-weight:800}h2{font-size:20px;margin:18px 0 8px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line);padding:12px 16px 0}
.in{max-width:760px;margin:0 auto}
.pill{font-size:13px;color:var(--mut)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:6px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:600 15px var(--f);color:var(--mut);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--b)}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px;overflow-x:auto}
.mut{color:var(--mut);font-size:14px;margin:4px 0}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
th{font-size:13px;color:var(--mut);font-weight:600}
.n{text-align:right;font-variant-numeric:tabular-nums}
.lead td{font-weight:700}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:90px}
select{min-width:60px;cursor:pointer}
input[type=number]{width:58px;min-width:0;text-align:center}
.p,.s{border-radius:8px;font:600 15px var(--f);cursor:pointer;padding:10px 16px}
.p{background:var(--b);color:#fff;border:0}.p:disabled{opacity:.4;cursor:default}
.s{background:none;border:1px solid var(--line);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.bd{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font:700 11px var(--f);font-style:normal;color:#0b2a33;margin-right:6px}
.bd.A{background:var(--a)}.bd.B{background:var(--b);color:#fff}.sexname.M{color:#1976d2;font-weight:700}.sexname.F{color:#e78ab3;font-weight:700}.sortbtn{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:inherit;cursor:pointer;white-space:nowrap}.sortbtn::after{content:" ↕";font-size:11px;opacity:.45}.sortbtn.up::after{content:" ↑";opacity:1}.sortbtn.down::after{content:" ↓";opacity:1}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.t{display:flex;flex-direction:column;gap:2px;font-size:15px}
.sc{display:flex;gap:6px;align-items:center}
.seg{display:flex;gap:4px}.seg button{width:38px;height:34px;border:1px solid var(--line);background:none;border-radius:6px;color:var(--ink);font:600 14px var(--f);cursor:pointer}
.seg .A.on{background:var(--a);border-color:var(--a);color:#0b2a33}.seg .B.on{background:var(--b);border-color:var(--b);color:#fff}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
</style></head><body>
<header><div class="in"><h1>Torneo</h1><div class="row" style="justify-content:space-between;align-items:center;margin:4px 0"><span class="pill" id="st"></span><button class="s" id="ab" onclick="login()" style="padding:6px 12px;font-size:13px"></button></div><nav id="nav"></nav></div></header>
<main id="v"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://gvnjbkeiwpggfwjmahpt.supabase.co',SUPABASE_KEY='sb_publishable_G3Qosi2CyZ4Pbcl4S9G1Jw_zFeLVY6-';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let S={players:[],sel:{},T:null,mode:3},tab='live',ADMIN=false,CODE='',timer,q=Promise.resolve();
let sorts={generale:{key:'med',dir:-1},gruppi:{key:'med',dir:-1}};
const norm=d=>{d=d&&typeof d=='object'?d:{};return{players:d.players||[],sel:d.sel||{},T:d.T||null,mode:d.mode||d.T?.mode||3}};
function setSt(t,err){const e=document.getElementById('st');if(e){e.textContent=t;e.style.color=err?'#c0392b':''}}
function save(){if(!ADMIN)return;clearTimeout(timer);setSt('Salvataggio…');timer=setTimeout(()=>{const snap=JSON.parse(JSON.stringify(S));
q=q.then(()=>sb.rpc('salva_stato',{p_codice:CODE,p_data:snap})).then(({error})=>setSt(error?'Errore di salvataggio: '+error.message:'Salvato',!!error)).catch(()=>setSt('Errore di rete',true))},350)}
async function fetchState(){const{data,error}=await sb.from('torneo_stato').select('data').eq('id',1).single();if(error){setSt('Errore di lettura: '+error.message,true);return false}S=norm(data.data);return true}
async function login(){if(ADMIN){ADMIN=false;CODE='';try{localStorage.removeItem('torneo-codice')}catch(e){}if(tab=='gruppi')tab='live';await fetchState();R();return}
const c=prompt('Codice organizzatore:');if(!c)return;const{data}=await sb.rpc('verifica_codice',{p_codice:c});
if(data===true){ADMIN=true;CODE=c;try{localStorage.setItem('torneo-codice',c)}catch(e){}R()}else alert('Codice non valido')}
async function init(){R();try{CODE=localStorage.getItem('torneo-codice')||''}catch(e){}
if(CODE){const{data}=await sb.rpc('verifica_codice',{p_codice:CODE});ADMIN=data===true;if(!ADMIN)CODE=''}
await fetchState();tab=S.T||!ADMIN?'live':'generale';R();
sb.channel('torneo').on('postgres_changes',{event:'*',schema:'public',table:'torneo_stato'},p=>{if(!ADMIN&&p.new&&p.new.data){S=norm(p.new.data);R()}}).subscribe();
setInterval(async()=>{if(!ADMIN&&await fetchState())R()},30000)}
const med=p=>p.g?p.tot/p.g:0,done=m=>m.s1!==''&&m.s2!==''&&+m.s1!==+m.s2;
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const key=p=>[...p].sort().join('-');
const used=T=>{const s=new Set();T.rounds.forEach(r=>r.matches.forEach(m=>{s.add(key(m.t1));s.add(key(m.t2))}));return s};
function cfg(){return S.T?.mode==2||S.mode==2?{mode:2,players:8,group:4,matches:2}:{mode:3,players:12,group:6,matches:3}}
function setMode(m){
  if(S.T){alert('Il torneo è già in corso. Per cambiare modalità deve terminare o essere azzerato.');return}
  S.mode=m;S.sel={};save();R();
}
function mk(A,B,u){
  const C=cfg(),G={};
  S.players.forEach(x=>G[x.id]=x.s||'M');
  const opp=new Set();
  for(const r of (S.T?.rounds||[])){
    for(const m of r.matches){
      for(const a of m.t1) for(const b of m.t2){opp.add(a+'|'+b);opp.add(b+'|'+a)}
    }
  }
  let best=null,bestScore=Infinity;
  const tries=220;
  for(let z=0;z<tries;z++){
    const a=sh(A),b=sh(B),pairs=a.map((x,k)=>[x,b[k]]);
    if(pairs.some(q=>u.has(key(q))))continue;
    for(let j=0;j<60;j++){
      const order=sh(pairs);let score=0;
      for(let k=0;k<C.matches;k++){
        const t1=order[2*k],t2=order[2*k+1];
        const m1=(G[t1[0]]=='M'?1:0)+(G[t1[1]]=='M'?1:0);
        const m2=(G[t2[0]]=='M'?1:0)+(G[t2[1]]=='M'?1:0);
        const ff1=m1===0,ff2=m2===0;
        if(ff1!==ff2)score+=1000;
        if((m1===2&&m2===0)||(m1===0&&m2===2))score+=1000;
        for(const x of t1)for(const y of t2)if(opp.has(x+'|'+y))score+=3;
      }
      if(score<bestScore){bestScore=score;best=order;if(score===0)break}
    }
    if(bestScore===0)break;
  }
  if(!best){
    const a=sh(A),candidates=[];
    function bt(i,remaining,pairs){
      if(i===a.length){candidates.push([...pairs]);return true}
      const ai=a[i],opts=sh(remaining).filter(b=>!u.has(key([ai,b])));
      for(const b of opts){const nr=remaining.filter(x=>x!==b);pairs.push([ai,b]);if(bt(i+1,nr,pairs))return true;pairs.pop()}
      return false;
    }
    bt(0,[...B],[]);if(candidates.length)best=candidates[0];
  }
  if(!best)throw new Error('Impossibile generare il turno senza ripetere una coppia di partner.');
  const p=sh(best);
  return{A,matches:Array.from({length:C.matches},(_,k)=>({t1:p[2*k],t2:p[2*k+1],s1:'',s2:''}))};
}
function table(){const T=S.T,t={};Object.keys(T.names).forEach(id=>t[id]={id,pt:0,g:0,w:0,pf:0,ps:0});
T.rounds.forEach(r=>r.matches.forEach(m=>{if(!done(m))return;const a=+m.s1,b=+m.s2;[[m.t1,a,b],[m.t2,b,a]].forEach(([tm,f,s])=>tm.forEach(id=>{const x=t[id];x.g++;x.pf+=f;x.ps+=s;if(f>s){x.pt+=3;x.w++}else if(f>=20)x.pt+=1}))}));
return Object.values(t).sort((a,b)=>b.pt-a.pt||(b.pf-b.ps)-(a.pf-a.ps)||b.pf-a.pf)}
function go(t){tab=t;R()}
function sortBy(view,key){
  const x=sorts[view]||{};
  if(x.key===key)x.dir*=-1;else{ x.key=key;x.dir=key==='n'||key==='c'||key==='s'?1:-1 }
  sorts[view]=x;R();
}
function cmpVal(a,b,key){
  let x,y;
  if(key==='med'){x=med(a);y=med(b)}
  else if(key==='g'){x=a.g||0;y=b.g||0}
  else if(key==='tot'){x=a.tot||0;y=b.tot||0}
  else if(key==='n'||key==='c'||key==='s'){x=(a[key]||'').toLocaleLowerCase('it');y=(b[key]||'').toLocaleLowerCase('it')}
  else{x=a[key]??0;y=b[key]??0}
  if(typeof x==='string')return x.localeCompare(y,'it',{sensitivity:'base'})
  return x-y;
}
function sortedPlayers(view){
  const o=sorts[view]||{key:'med',dir:-1};
  return [...S.players].sort((a,b)=>cmpVal(a,b,o.key)*o.dir || (a.id||'').localeCompare(b.id||''));
}
function th(view,label,key,cls=''){
  const o=sorts[view]||{}; const state=o.key===key?(o.dir===1?'up':'down'):'';
  return `<th class="${cls}"><button class="sortbtn ${state}" onclick="sortBy('${view}','${key}')">${label}</button></th>`;
}
function R(){document.getElementById('nav').innerHTML=[['live','Classifica live'],['turni','Turni'],['gruppi','Gruppi'],['generale','Classifica Generale']].filter(x=>ADMIN||x[0]!='gruppi').map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
document.getElementById('v').innerHTML=({live,turni,gruppi,generale})[tab]();document.getElementById('ab').textContent=ADMIN?'Esci':'Organizzatore';
if(!ADMIN){setSt('Sola lettura · si aggiorna in automatico');document.querySelectorAll('#v input, #v select').forEach(i=>i.disabled=true);document.querySelectorAll('#v button,#v .adm').forEach(e=>e.remove())}}
const none=()=>ADMIN?`<div class="card"><h2>Nessun torneo in corso</h2><p>Scegli la modalità, seleziona i giocatori e avvia il torneo.</p><button class="p" onclick="go('gruppi')">Scegli i giocatori</button></div>`:`<div class="card"><h2>Torneo non ancora iniziato</h2><p>La classifica comparirà qui appena parte il primo turno.</p></div>`;
function live(){const T=S.T;if(!T)return none();const t=table(),last=T.rounds[T.rounds.length-1];
return `<p class="mut">Turno ${T.rounds.length} di 5 · ${last.matches.filter(done).length}/${last.matches.length} partite inserite</p><div class="card"><table><tr><th>#</th><th>Giocatore</th><th class="n">Pt</th><th class="n">G</th><th class="n">V</th><th class="n">Diff</th></tr>${t.map((x,i)=>`<tr class="${i?'':'lead'}"><td>${i+1}</td><td><i class="bd ${T.grp[x.id]}">${T.grp[x.id]}</i><span class="sexname ${S.players.find(p=>p.id==x.id)?.s=='F'?'F':'M'}">${esc(T.names[x.id])}</span></td><td class="n">${x.pt}</td><td class="n">${x.g}</td><td class="n">${x.w}</td><td class="n">${x.pf-x.ps}</td></tr>`).join('')}</table></div><p class="mut">Vittoria 3 punti · sconfitta con 20 o più punti fatti 1 punto, sotto 20 punti 0. A parità: differenza punti.</p>`}
const team=(T,r,tm)=>`<div class="t">${tm.map(id=>{const g=r.A.includes(id)?'A':'B';const p=S.players.find(x=>x.id==id);const sex=p?.s=='F'?'F':'M';return `<span><i class="bd ${g}">${g}</i><span class="sexname ${sex}">${esc(T.names[id])}</span></span>`}).join('')}</div>`;
function turni(){const T=S.T;if(!T)return none();const C=cfg(),n=T.rounds.length,last=T.rounds[n-1],ld=last.matches.every(done);
let ctl=n<5?`<button class="p" ${ld?'':'disabled'} onclick="nxt()">Genera turno ${n+1}</button>`:ld?(T.applied?`<p class="mut">Risultati già aggiunti alla Classifica Generale.</p>`:`<button class="p" onclick="applyG()">Aggiungi alla Classifica Generale</button>`):'';
const body=T.rounds.map((r,i)=>`<h2>Turno ${i+1}</h2>`+r.matches.map((m,k)=>{const lk=i<n-1?'disabled':'',d=done(m),tie=m.s1!==''&&m.s2!==''&&+m.s1===+m.s2;
return `<div class="card"><div class="mut">Campo ${k+1}</div><div class="m">${team(T,r,m.t1)}<div class="sc"><input type="number" min="0" inputmode="numeric" value="${m.s1}" ${lk} aria-label="Punti squadra 1" onchange="sc(${i},${k},'s1',this.value)">–<input type="number" min="0" inputmode="numeric" value="${m.s2}" ${lk} aria-label="Punti squadra 2" onchange="sc(${i},${k},'s2',this.value)"></div>${team(T,r,m.t2)}</div>${tie?'<div class="mut">Il pareggio non è ammesso: correggi il punteggio.</div>':''}${d?`<div class="mut">Vincitori 3 pt · sconfitti ${Math.min(+m.s1,+m.s2)>=20?1:0} pt</div>`:''}</div>`}).join('')).reverse();
return `<p class="mut">Modalità: ${C.mode===2?'2 campi · 8 giocatori':'3 campi · 12 giocatori'} · 5 turni</p><div class="row adm">${ctl}</div>`+body.join('')}
const split=()=>{const C=cfg(),ids=S.players.filter(p=>S.sel[p.id]).sort((a,b)=>med(b)-med(a)).map(p=>p.id);return{A:ids.slice(0,C.group),B:ids.slice(C.group,C.group*2)}};
function gruppi(){
  const C=cfg(),P=sortedPlayers('gruppi'),n=P.filter(p=>S.sel[p.id]).length,ok=n===C.players,g=ok?split():null;
  const col=(L,ids)=>`<div style="min-width:0"><div style="margin-bottom:8px"><i class="bd ${L}">${L}</i><b>Gruppo ${L}</b></div><table>${th('gruppi','Nome','n')}${th('gruppi','Cognome','c')}${th('gruppi','Partite','g','n')}${th('gruppi','Media','med','n')} ${ids.map(id=>{const p=S.players.find(x=>x.id==id);return `<tr><td><span class="sexname ${p.s=='F'?'F':'M'}">${esc(p.n)}</span></td><td>${esc(p.c)}</td><td class="n">${p.g||0}</td><td class="n">${med(p).toFixed(2)}</td></tr>`}).join('')}</table></div>`;
  return `<div class="card"><h2>Modalità torneo</h2><p>Scegli quanti campi utilizzare.</p><div class="row"><button class="${C.mode===2?'p':'s'}" onclick="setMode(2)">2 campi · 8 giocatori</button><button class="${C.mode===3?'p':'s'}" onclick="setMode(3)">3 campi · 12 giocatori</button></div></div>
  <div class="card"><p>Selezioni i ${C.players} giocatori della Classifica Generale che partecipano. Il sistema li divide per media: le ${C.group} medie più alte nel gruppo A, le altre ${C.group} nel gruppo B.</p><p><b>${n}/${C.players} selezionati</b></p><div class="row"><button class="s" onclick="selTop()">Seleziona i primi ${C.players}</button><button class="s" onclick="S.sel={};save();R()">Azzera</button></div>${P.length<C.players?`<p class="mut">Servono almeno ${C.players} giocatori nella Classifica Generale.</p>`:''}<table><tr><th style="width:40px"></th>${th('gruppi','Nome','n')}${th('gruppi','Cognome','c')}${th('gruppi','Sesso','s')}${th('gruppi','Partite','g','n')}${th('gruppi','Media','med','n')}</tr>${P.map(p=>`<tr><td style="width:40px"><input type="checkbox" style="width:22px;height:22px;min-width:0" aria-label="Seleziona ${esc(p.n)} ${esc(p.c)}" ${S.sel[p.id]?'checked':''} ${!S.sel[p.id]&&n>=C.players?'disabled':''} onchange="tg('${p.id}')"></td><td><span class="sexname ${p.s=='F'?'F':'M'}">${esc(p.n)}</span></td><td>${esc(p.c)}</td><td>${p.s||'M'}</td><td class="n">${p.g||0}</td><td class="n">${med(p).toFixed(2)}</td></tr>`).join('')}</table></div>
  ${ok?`<div class="card"><div class="m" style="align-items:start">${col('A',g.A)}<span></span>${col('B',g.B)}</div><div class="row"><button class="p" onclick="start()">Avvia torneo</button></div></div>`:''}`;
}
function generale(){
  const P=sortedPlayers('generale'),I=(id,f,v,t)=>`<input class="sexname ${S.players.find(x=>x.id==id)?.s=='F'?'F':'M'}" ${t||''} value="${esc(v)}" onchange="ed('${id}','${f}',this.value)">`,Sel=(id,v)=>`<select onchange="ed('${id}','s',this.value)"><option value="M" ${v=='M'?'selected':''}>M</option><option value="F" ${v=='F'?'selected':''}>F</option></select>`;
  return `<div class="card"><table><tr><th>#</th>${th('generale','Nome','n')}${th('generale','Cognome','c')}${th('generale','Sesso','s')}${th('generale','Punti','tot','n')}${th('generale','Partite','g','n')}${th('generale','Media','med','n')}<th></th></tr>${P.map((p,i)=>`<tr><td>${i+1}</td><td>${I(p.id,'n',p.n)}</td><td>${I(p.id,'c',p.c)}</td><td>${Sel(p.id,p.s||'M')}</td><td>${I(p.id,'tot',p.tot,'type="number" min="0"')}</td><td>${I(p.id,'g',p.g,'type="number" min="0"')}</td><td class="n"><b>${med(p).toFixed(2)}</b></td><td><button class="x" aria-label="Elimina" onclick="del('${p.id}')">✕</button></td></tr>`).join('')}</table></div>
<div class="card adm"><div class="row"><input id="nn" placeholder="Nome" style="flex:1"><input id="nc" placeholder="Cognome" style="flex:1"><select id="ns" style="width:auto"><option value="M">M</option><option value="F">F</option></select><button class="p" onclick="add()">Aggiungi</button></div><p class="mut">Media = punti totali ÷ partite giocate.</p><button class="s" onclick="if(confirm('Eliminare tutti i giocatori e il torneo?')){S={players:[],sel:{},T:null};save();R()}">Svuota tutto</button></div>`}

function ed(id,f,v){const p=S.players.find(x=>x.id==id);p[f]=(f=='n'||f=='c'||f=='s')?v.trim():Math.max(0,+v||0);save();R()}
function del(id){S.players=S.players.filter(x=>x.id!=id);delete S.sel[id];save();R()}
function add(){const n=nn.value.trim(),c=nc.value.trim(),s=ns.value;if(!n)return;S.players.push({id:'p'+Date.now().toString(36),n,c,s,tot:0,g:0});save();R()}
function tg(id){if(S.sel[id])delete S.sel[id];else if(Object.keys(S.sel).length<cfg().players)S.sel[id]=1;save();R()}
function selTop(){S.sel={};[...S.players].sort((a,b)=>med(b)-med(a)).slice(0,cfg().players).forEach(p=>S.sel[p.id]=1);save();R()}
function start(){if(S.T&&!confirm('Il torneo in corso verrà azzerato. Continuare?'))return;const g=split(),names={},grp={};g.A.forEach(id=>grp[id]='A');g.B.forEach(id=>grp[id]='B');S.players.forEach(p=>{if(grp[p.id])names[p.id]=p.n+' '+(p.c||'').charAt(0)+'.'});
S.T={mode:S.mode,players:S.mode==2?8:12,names,grp,applied:false,rounds:[mk(g.A,g.B,new Set())]};save();go('turni')}
function sc(i,k,f,v){
  if(v===''){
    S.T.rounds[i].matches[k][f]='';
  }else{
    const n=Number(v);
    S.T.rounds[i].matches[k][f]=Number.isFinite(n)?Math.max(0,Math.floor(n)):'';
  }
  save();
  R();
}
function nxt(){
  const T=S.T,last=T.rounds[T.rounds.length-1];
  if(!last.matches.every(done))return;
  const W=[],L=[];
  last.matches.forEach(m=>{
    const w=+m.s1>+m.s2;
    (w?m.t1:m.t2).forEach(x=>W.push(x));
    (w?m.t2:m.t1).forEach(x=>L.push(x));
  });
  try{
    T.rounds.push(mk(W,L,used(T)));
    save();
    R();
  }catch(e){
    setSt('Errore generazione turno: '+e.message,true);
  }
}
function applyG(){
  table().forEach(x=>{
    const p=S.players.find(q=>q.id==x.id);
    if(p){
      p.tot+=x.pt;
      p.g+=x.g;
    }
  });
  S.T.applied=true;
  save();
  go('generale');
}
init();
