<style>

.updateplus{color:#1976d2;font-weight:800;white-space:nowrap}.updateneg{color:#e78ab3;font-weight:800;white-space:nowrap}.previewbox{border:2px solid var(--b);border-radius:10px;padding:12px;margin-top:12px}.public{display:inline-block}.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}
.user-hidden{display:none!important}
.login-overlay{position:fixed;inset:0;z-index:20;background:#0009;display:none;align-items:center;justify-content:center;padding:18px}.login-overlay.open{display:flex}.login-card{width:100%;max-width:380px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 12px 40px #0003}.login-card label{display:block;font-weight:600;margin:12px 0 5px}.login-card input{min-width:0;padding:11px}.login-card .row button{flex:1}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
</style></head><body>
<header><div class="in"><h1>Torneo Beach Volley Leon</h1><div class="row" style="justify-content:space-between;align-items:center;margin:4px 0"><span class="pill" id="st"></span><button class="s" id="ab" onclick="login()" style="padding:6px 12px;font-size:13px"></button></div><nav id="nav"></nav></div></header>
<main id="v"></main>
<div id="loginOverlay" class="login-overlay" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <div class="login-card">
    <h2 id="loginTitle" style="margin-top:0">Accedi al Torneo Beach Volley Leon</h2>

    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://gvnjbkeiwpggfwjmahpt.supabase.co',SUPABASE_KEY='sb_publishable_G3Qosi2CyZ4Pbcl4S9G1Jw_zFeLVY6-';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let S={players:[],sel:{},T:null,mode:3},tab='live',ROLE='NONE',ADMIN=false,AUTH=null,timer,q=Promise.resolve();
let sorts={generale:{key:'med',dir:-1},gruppi:{key:'med',dir:-1}};
const norm=d=>{d=d&&typeof d=='object'?d:{};const players=(d.players||[]).map(p=>{const oldG=Number.isFinite(+p.g)?+p.g:0;const t=Number.isFinite(+p.t)?+p.t:Math.floor(oldG/5);return{...p,t}});return{players,sel:d.sel||{},T:d.T||null,mode:d.mode||d.T?.mode||3}};
function setSt(t,err){const e=document.getElementById('st');if(e){e.textContent=t;e.style.color=err?'#c0392b':''}}
function save(){if(ROLE!=='ADMIN'&&ROLE!=='USER')return;clearTimeout(timer);setSt('Salvataggio…');timer=setTimeout(()=>{const snap=JSON.parse(JSON.stringify(S));
q=q.then(()=>sb.rpc('salva_stato_auth',{p_data:snap})).then(({error})=>setSt(error?'Errore di salvataggio: '+error.message:'Salvato',!!error)).catch(()=>setSt('Errore di rete',true))},350)}
async function fetchState(){const{data,error}=await sb.from('torneo_stato').select('data').eq('id',1).single();if(error){setSt('Errore di lettura: '+error.message,true);return false}S=norm(data.data);return true}
async function login(){
  if(AUTH){
    setSt('Uscita…');
    const {error}=await sb.auth.signOut();
    if(error){setSt('Errore di uscita: '+error.message,true);return}
    AUTH=null;ROLE='NONE';ADMIN=false;
    setSt('Accesso richiesto');
    tab=S.T?'live':'gruppi';
    R();
    return;
  }
  openLogin();
}
function openLogin(){
  const o=document.getElementById('loginOverlay');
  o.classList.add('open');
  setTimeout(()=>document.getElementById('loginEmail')?.focus(),50);
}
function closeLogin(){
  document.getElementById('loginOverlay').classList.remove('open');
}
async function submitLogin(event){
  event.preventDefault();
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const button=document.getElementById('loginSubmit');
  if(!email||!password)return;
  button.disabled=true;button.textContent='Accesso…';setSt('Accesso…');
  const{data,error}=await sb.auth.signInWithPassword({email,password});
  button.disabled=false;button.textContent='Accedi';
  if(error){setSt('Accesso negato',true);alert('Email o password non corretti.');document.getElementById('loginPassword').select();return}
  closeLogin();
  document.getElementById('loginPassword').value='';
  await setAuth(data.user);
}
async function setAuth(user){
  AUTH=user||null;
  if(!user){ROLE='NONE';ADMIN=false;setSt('Accesso richiesto');R();return}
  const{data,error}=await sb.rpc('get_my_role');
  if(error||!data){await sb.auth.signOut();AUTH=null;ROLE='NONE';ADMIN=false;setSt('Ruolo non configurato',true);alert('Utente autenticato ma ruolo non configurato in Supabase.');R();return}
  ROLE=String(data).toUpperCase();ADMIN=ROLE==='ADMIN';
  if(ROLE!=='ADMIN'&&ROLE!=='USER'){await sb.auth.signOut();AUTH=null;ROLE='NONE';ADMIN=false;setSt('Ruolo non valido',true);R();return}
  await fetchState();
  if(ADMIN && S.T && !S.T.applied && S.T.review!=='rejected' && S.T.rounds?.length===5 && S.T.rounds[4]?.matches?.every(done)){tab='aggiorna';}else tab=S.T?'live':'gruppi';
  R();
}
async function init(){
  R();
  const{data}=await sb.auth.getSession();
  await setAuth(data.session?.user||null);
  sb.auth.onAuthStateChange(async(_event,session)=>{await setAuth(session?.user||null)});
  sb.channel('torneo').on('postgres_changes',{event:'*',schema:'public',table:'torneo_stato'},p=>{
    // Gli aggiornamenti realtime servono agli utenti, ma l'Admin non deve
    // sovrascrivere le modifiche locali mentre sta editando la classifica.
    if(!ADMIN&&p.new&&p.new.data){S=norm(p.new.data);R()}
  }).subscribe();
  setInterval(async()=>{
    // Anche il polling non deve sovrascrivere lo stato locale dell'Admin.
    if(!ADMIN&&await fetchState())R()
  },30000)
}
const med=p=>p.t?p.tot/p.t:0,done=m=>m.s1!==''&&m.s2!==''&&+m.s1!==+m.s2;
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const key=p=>[...p].sort().join('-');
const used=T=>{const s=new Set();T.rounds.forEach(r=>r.matches.forEach(m=>{s.add(key(m.t1));s.add(key(m.t2))}));return s};
function cfg(){return S.T?.mode==2||S.mode==2?{mode:2,players:8,group:4,matches:2}:{mode:3,players:12,group:6,matches:3}}
function setMode(m){
  if(S.T){
    if(S.T.mode===m){S.mode=m;return R()}
    if(!confirm('Il torneo attuale verrà azzerato per passare alla modalità '+(m===2?'2 campi · 8 giocatori':'3 campi · 12 giocatori')+'. Continuare?'))return;
    S.T=null;
    S.sel={};
  }
  S.mode=m;
  save();
  R();
}
function resetTournament(){
  if(!S.T)return;
  if(!confirm('Azzerare completamente il torneo in corso? I risultati del torneo non verranno aggiunti alla Classifica Generale.'))return;
  S.T=null;
  S.sel={};
  save();
  go('gruppi');
}
function mk(A,B,u){
  const C=cfg(),G={};
  S.players.forEach(x=>G[x.id]=x.s||'M');
  const opp=new Set();
  for(const r of (S.T?.rounds||[])){
    for(const m of r.matches){
      for(const a of m.t1) for(const b of m.t2){opp.add(a+'|'+b);opp.add(b+'|'+a)}
    }
  }
  let best=null,bestScore=Infinity;
  const tries=220;
  for(let z=0;z<tries;z++){
    const a=sh(A),b=sh(B),pairs=a.map((x,k)=>[x,b[k]]);
    if(pairs.some(q=>u.has(key(q))))continue;
    for(let j=0;j<60;j++){
      const order=sh(pairs);let score=0;
      for(let k=0;k<C.matches;k++){
        const t1=order[2*k],t2=order[2*k+1];
        const m1=(G[t1[0]]=='M'?1:0)+(G[t1[1]]=='M'?1:0);
        const m2=(G[t2[0]]=='M'?1:0)+(G[t2[1]]=='M'?1:0);
        const ff1=m1===0,ff2=m2===0;
        if(ff1!==ff2)score+=1000;
        if((m1===2&&m2===0)||(m1===0&&m2===2))score+=1000;
        for(const x of t1)for(const y of t2)if(opp.has(x+'|'+y))score+=3;
      }
      if(score<bestScore){bestScore=score;best=order;if(score===0)break}
    }
    if(bestScore===0)break;
  }
  if(!best){
    const a=sh(A),candidates=[];
    function bt(i,remaining,pairs){
      if(i===a.length){candidates.push([...pairs]);return true}
      const ai=a[i],opts=sh(remaining).filter(b=>!u.has(key([ai,b])));
      for(const b of opts){const nr=remaining.filter(x=>x!==b);pairs.push([ai,b]);if(bt(i+1,nr,pairs))return true;pairs.pop()}
      return false;
    }
    bt(0,[...B],[]);if(candidates.length)best=candidates[0];
  }
  if(!best)throw new Error('Impossibile generare il turno senza ripetere una coppia di partner.');
  const p=sh(best);
  return{A,matches:Array.from({length:C.matches},(_,k)=>({t1:p[2*k],t2:p[2*k+1],s1:'',s2:''}))};
}
function table(){const T=S.T,t={};Object.keys(T.names).forEach(id=>t[id]={id,pt:0,g:0,w:0,pf:0,ps:0});
T.rounds.forEach(r=>r.matches.forEach(m=>{if(!done(m))return;const a=+m.s1,b=+m.s2;[[m.t1,a,b],[m.t2,b,a]].forEach(([tm,f,s])=>tm.forEach(id=>{const x=t[id];x.g++;x.pf+=f;x.ps+=s;if(f>s){x.pt+=3;x.w++}else if(f>=20)x.pt+=1}))}));
return Object.values(t).sort((a,b)=>b.pt-a.pt||(b.pf-b.ps)-(a.pf-a.ps)||b.pf-a.pf)}
function go(t){tab=t;R()}
function sortBy(view,key){
  const x=sorts[view]||{};
  if(x.key===key)x.dir*=-1;else{ x.key=key;x.dir=key==='n'||key==='c'||key==='s'?1:-1 }
  sorts[view]=x;R();
}
function cmpVal(a,b,key){
  let x,y;
  if(key==='med'){x=med(a);y=med(b)}
  else if(key==='g'){x=a.g||0;y=b.g||0}
  else if(key==='tot'){x=a.tot||0;y=b.tot||0}
  else if(key==='n'||key==='c'||key==='s'){x=(a[key]||'').toLocaleLowerCase('it');y=(b[key]||'').toLocaleLowerCase('it')}
  else{x=a[key]??0;y=b[key]??0}
  if(typeof x==='string')return x.localeCompare(y,'it',{sensitivity:'base'})
  return x-y;
}
function sortedPlayers(view){
  const o=sorts[view]||{key:'med',dir:-1};
  return [...S.players].sort((a,b)=>cmpVal(a,b,o.key)*o.dir || (a.id||'').localeCompare(b.id||''));
}
function th(view,label,key,cls=''){
  const o=sorts[view]||{}; const state=o.key===key?(o.dir===1?'up':'down'):'';
  return `<th class="${cls}"><button class="sortbtn ${state}" onclick="sortBy('${view}','${key}')">${label}</button></th>`;
}
function R(){
  document.getElementById('nav').innerHTML=[['live','Classifica live'],['turni','Turni'],['gruppi','Gruppi'],['generale','Classifica Generale']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  document.getElementById('v').innerHTML=({live,turni,gruppi,generale,aggiorna})[tab]();
  document.getElementById('ab').textContent=AUTH?(ADMIN?'Esci':'Esci'):'Login';
  if(!AUTH){setSt('Login richiesto per modificare il torneo');document.querySelectorAll('#v input, #v select').forEach(i=>i.disabled=true);document.querySelectorAll('#v button:not(.sortbtn)').forEach(e=>{if(!e.closest('nav'))e.disabled=true});}
  else if(!ADMIN){setSt('Utente · torneo modificabile');document.querySelectorAll('#v .adm').forEach(e=>e.remove());document.querySelectorAll('#v input, #v select').forEach(i=>{if(tab==='generale')i.disabled=true});}
  else setSt('Admin · accesso completo');
}
const none=()=>`<div class="card"><h2>Nessun torneo in corso</h2><p>Scegli la modalità, seleziona i giocatori e avvia il torneo.</p><button class="p" onclick="go('gruppi')">Scegli i giocatori</button></div>`;
function live(){const T=S.T;if(!T)return none();const t=table(),last=T.rounds[T.rounds.length-1];
return `<p class="mut">Turno ${T.rounds.length} di 5 · ${last.matches.filter(done).length}/${last.matches.length} partite inserite</p><div class="card"><table><tr><th>#</th><th>Giocatore</th><th class="n">Pt</th><th class="n">G</th><th class="n">V</th><th class="n">Diff</th></tr>${t.map((x,i)=>`<tr class="${i?'':'lead'}"><td>${i+1}</td><td><i class="bd ${T.grp[x.id]}">${T.grp[x.id]}</i><span class="sexname ${S.players.find(p=>p.id==x.id)?.s=='F'?'F':'M'}">${esc(T.names[x.id])}</span></td><td class="n">${x.pt}</td><td class="n">${x.g}</td><td class="n">${x.w}</td><td class="n">${x.pf-x.ps}</td></tr>`).join('')}</table></div><p class="mut">Vittoria 3 punti · sconfitta con 20 o più punti fatti 1 punto, sotto 20 punti 0. A parità: differenza punti.</p>${T.rounds.length===5&&last.matches.every(done)&&!T.applied?`<div class="row"><button class="p public" onclick="go('aggiorna')">Aggiorna classifica generale</button></div>`:T.rounds.length===5&&last.matches.every(done)&&T.applied?`<p class="mut">Classifica Generale già aggiornata con questo torneo.</p>`:''}`}
const team=(T,r,tm)=>`<div class="t">${tm.map(id=>{const g=r.A.includes(id)?'A':'B';const p=S.players.find(x=>x.id==id);const sex=p?.s=='F'?'F':'M';return `<span><i class="bd ${g}">${g}</i><span class="sexname ${sex}">${esc(T.names[id])}</span></span>`}).join('')}</div>`;
function turni(){const T=S.T;if(!T)return none();const C=cfg(),n=T.rounds.length,last=T.rounds[n-1],ld=last.matches.every(done);
let ctl=n<5?`<button class="p" ${ld?'':'disabled'} onclick="nxt()">Genera turno ${n+1}</button>`:ld?(T.applied?`<p class="mut">Classifica Generale già aggiornata con questo torneo.</p>`:''):'';
const body=T.rounds.map((r,i)=>`<h2>Turno ${i+1}</h2>`+r.matches.map((m,k)=>{const lk=i<n-1?'disabled':'',d=done(m),tie=m.s1!==''&&m.s2!==''&&+m.s1===+m.s2;
return `<div class="card"><div class="mut">Campo ${k+1}</div><div class="m">${team(T,r,m.t1)}<div class="sc"><input type="number" min="0" inputmode="numeric" value="${m.s1}" ${lk} aria-label="Punti squadra 1" onchange="sc(${i},${k},'s1',this.value)">–<input type="number" min="0" inputmode="numeric" value="${m.s2}" ${lk} aria-label="Punti squadra 2" onchange="sc(${i},${k},'s2',this.value)"></div>${team(T,r,m.t2)}</div>${tie?'<div class="mut">Il pareggio non è ammesso: correggi il punteggio.</div>':''}${d?`<div class="mut">Vincitori 3 pt · sconfitti ${Math.min(+m.s1,+m.s2)>=20?1:0} pt</div>`:''}</div>`}).join('')).reverse();
return `<p class="mut">Modalità: ${C.mode===2?'2 campi · 8 giocatori':'3 campi · 12 giocatori'} · 5 turni</p><div class="row">${ctl}</div>`+body.join('')}
const split=()=>{const C=cfg(),ids=S.players.filter(p=>S.sel[p.id]).sort((a,b)=>med(b)-med(a)).map(p=>p.id);return{A:ids.slice(0,C.group),B:ids.slice(C.group,C.group*2)}};
function gruppi(){
  const C=cfg(),P=sortedPlayers('gruppi'),n=P.filter(p=>S.sel[p.id]).length,ok=n===C.players,g=ok?split():null;
  const col=(L,ids)=>`<div style="min-width:0"><div style="margin-bottom:8px"><i class="bd ${L}">${L}</i><b>Gruppo ${L}</b></div><table>${th('gruppi','Nome','n')}${th('gruppi','Cognome','c')}${th('gruppi','Tornei','t','n')}${th('gruppi','Media','med','n')} ${ids.map(id=>{const p=S.players.find(x=>x.id==id);return `<tr><td><span class="sexname ${p.s=='F'?'F':'M'}">${esc(p.n)}</span></td><td>${esc(p.c)}</td><td class="n">${p.t||0}</td><td class="n">${med(p).toFixed(2)}</td></tr>`}).join('')}</table></div>`;
  const riepilogo=ok?`<div class="card"><h2>Gruppi definitivi</h2><div class="m" style="align-items:start">${col('A',g.A)}<span></span>${col('B',g.B)}</div><div class="row"><button class="p" onclick="start()">Avvia torneo</button></div></div>`:'';
  return `${riepilogo}<div class="card"><h2>Modalità torneo</h2><p>Scegli quanti campi utilizzare.</p><div class="row"><button class="${C.mode===2?'p':'s'}" onclick="setMode(2)">2 campi · 8 giocatori</button><button class="${C.mode===3?'p':'s'}" onclick="setMode(3)">3 campi · 12 giocatori</button>${S.T?'<button class="s" onclick="resetTournament()">Azzera torneo</button>':''}</div>${S.T?'<p class="mut">È già presente un torneo in corso. Cambiando modalità verrà chiesto di confermare l’azzeramento.</p>':''}</div>
  <div class="card"><p>Selezioni i ${C.players} giocatori della Classifica Generale che partecipano. Il sistema li divide per media: le ${C.group} medie più alte nel gruppo A, le altre ${C.group} nel gruppo B.</p><p><b>${n}/${C.players} selezionati</b></p><div class="row"><button class="s" onclick="selTop()">Seleziona i primi ${C.players}</button><button class="s" onclick="S.sel={};save();R()">Azzera</button></div>${P.length<C.players?`<p class="mut">Servono almeno ${C.players} giocatori nella Classifica Generale.</p>`:''}<table><tr><th style="width:40px"></th>${th('gruppi','Nome','n')}${th('gruppi','Cognome','c')}${th('gruppi','Sesso','s')}${th('gruppi','Tornei','t','n')}${th('gruppi','Media','med','n')}</tr>${P.map(p=>`<tr><td style="width:40px"><input type="checkbox" style="width:22px;height:22px;min-width:0" aria-label="Seleziona ${esc(p.n)} ${esc(p.c)}" ${S.sel[p.id]?'checked':''} ${!S.sel[p.id]&&n>=C.players?'disabled':''} onchange="tg('${p.id}')"></td><td><span class="sexname ${p.s=='F'?'F':'M'}">${esc(p.n)}</span></td><td>${esc(p.c)}</td><td>${p.s||'M'}</td><td class="n">${p.t||0}</td><td class="n">${med(p).toFixed(2)}</td></tr>`).join('')}</table></div>
  `;
}
function generale(){
  const P=sortedPlayers('generale'),I=(id,f,v,t)=>`<input class="sexname ${S.players.find(x=>x.id==id)?.s=='F'?'F':'M'}" ${t||''} value="${esc(v)}" onchange="ed('${id}','${f}',this.value)">`,Sel=(id,v)=>`<select onchange="ed('${id}','s',this.value)"><option value="M" ${v=='M'?'selected':''}>M</option><option value="F" ${v=='F'?'selected':''}>F</option></select>`;
  return `<div class="card"><table><tr><th>#</th>${th('generale','Nome','n')}${th('generale','Cognome','c')}${th('generale','Sesso','s')}${th('generale','Punti','tot','n')}${th('generale','Tornei','t','n')}${th('generale','Media','med','n')}<th></th></tr>${P.map((p,i)=>`<tr><td>${i+1}</td><td>${I(p.id,'n',p.n)}</td><td>${I(p.id,'c',p.c)}</td><td>${Sel(p.id,p.s||'M')}</td><td>${I(p.id,'tot',p.tot,'type="number" min="0"')}</td><td>${I(p.id,'t',p.t,'type="number" min="0"')}</td><td class="n"><b>${med(p).toFixed(2)}</b></td><td class="adm"><button class="x" aria-label="Elimina" onclick="del('${p.id}')">✕</button></td></tr>`).join('')}</table></div>
<div class="card adm"><div class="row"><input id="nn" placeholder="Nome" style="flex:1"><input id="nc" placeholder="Cognome" style="flex:1"><select id="ns" style="width:auto"><option value="M">M</option><option value="F">F</option></select><button class="p" onclick="add()">Aggiungi</button></div><p class="mut">Media = punti totali ÷ tornei giocati.</p><button class="s" onclick="if(confirm('Eliminare tutti i giocatori e il torneo?')){S={players:[],sel:{},T:null};save();R()}">Svuota tutto</button></div>`}

function ed(id,f,v){const p=S.players.find(x=>x.id==id);p[f]=(f=='n'||f=='c'||f=='s')?v.trim():Math.max(0,+v||0);save();R()}
function del(id){S.players=S.players.filter(x=>x.id!=id);delete S.sel[id];save();R()}
function add(){const n=nn.value.trim(),c=nc.value.trim(),s=ns.value;if(!n)return;S.players.push({id:'p'+Date.now().toString(36),n,c,s,tot:0,t:0});save();R()}
function tg(id){if(S.sel[id])delete S.sel[id];else if(Object.keys(S.sel).length<cfg().players)S.sel[id]=1;save();R()}
function selTop(){S.sel={};[...S.players].sort((a,b)=>med(b)-med(a)).slice(0,cfg().players).forEach(p=>S.sel[p.id]=1);save();R()}
function start(){if(S.T&&!confirm('Il torneo in corso verrà azzerato. Continuare?'))return;const g=split(),names={},grp={};g.A.forEach(id=>grp[id]='A');g.B.forEach(id=>grp[id]='B');S.players.forEach(p=>{if(grp[p.id])names[p.id]=p.n+' '+(p.c||'').charAt(0)+'.'});
S.T={mode:S.mode,players:S.mode==2?8:12,names,grp,applied:false,rounds:[mk(g.A,g.B,new Set())]};save();go('turni')}
function sc(i,k,f,v){
  if(v===''){
    S.T.rounds[i].matches[k][f]='';
  }else{
    const n=Number(v);
    S.T.rounds[i].matches[k][f]=Number.isFinite(n)?Math.max(0,Math.floor(n)):'';
  }
  save();
  if(S.T.rounds.length===5 && S.T.rounds[4].matches.every(done)){ S.T.review='pending'; save(); go('live'); return; }
  R();
}
function nxt(){
  const T=S.T,last=T.rounds[T.rounds.length-1];
  if(!last.matches.every(done))return;
  const W=[],L=[];
  last.matches.forEach(m=>{
    const w=+m.s1>+m.s2;
    (w?m.t1:m.t2).forEach(x=>W.push(x));
    (w?m.t2:m.t1).forEach(x=>L.push(x));
  });
  try{
    T.rounds.push(mk(W,L,used(T)));
    save();
    R();
  }catch(e){
    setSt('Errore generazione turno: '+e.message,true);
  }
}
function updateRows(){
  return table().map(x=>{
    const p=S.players.find(q=>q.id==x.id);
    return {id:x.id,name:p?.n||'',surname:p?.c||'',sex:p?.s||'M',oldTot:p?.tot||0,oldT:p?.t||0,addPt:x.pt,addT:1,newTot:(p?.tot||0)+x.pt,newT:(p?.t||0)+1,newMed:((p?.t||0)+1)?((p?.tot||0)+x.pt)/((p?.t||0)+1):0};
  });
}
function aggiorna(){
  const T=S.T;
  if(!T)return none();
  const last=T.rounds[T.rounds.length-1];
  if(T.rounds.length<5 || !last.matches.every(done))return `<div class="card"><h2>Aggiornamento classifica generale</h2><p>Prima devono essere completati tutti i risultati del quinto turno.</p></div>`;
  if(T.applied)return `<div class="card"><h2>Classifica Generale già aggiornata</h2><p>Questo torneo è già stato contabilizzato.</p></div>`;
  if(T.review==='rejected')return `<div class="card"><h2>Aggiornamento classifica rifiutato</h2><p>La proposta non è stata applicata. È possibile riproporla dalla Classifica live.</p><button class="p" onclick="proponiAggiornamento()">Riproporre aggiornamento</button></div>`;
  const rows=updateRows();
  return `<div class="card"><h2>Aggiorna classifica generale</h2><p>Questa è un'anteprima delle modifiche che verranno applicate. I valori con <b>+</b> indicano ciò che verrà aggiunto alla classifica.</p><div class="previewbox"><table><tr><th>Giocatore</th><th class="n">Punti attuali</th><th class="n">Variazione</th><th class="n">Tornei attuali</th><th class="n">Nuovi tornei</th><th class="n">Nuova media</th></tr>${rows.map(r=>`<tr><td><span class="sexname ${r.sex=='F'?'F':'M'}">${esc(r.name)} ${esc(r.surname)}</span></td><td class="n">${r.oldTot}</td><td class="n"><b class="updateplus">+${r.addPt}</b></td><td class="n">${r.oldT}</td><td class="n"><b class="updateplus">+${r.addT}</b></td><td class="n"><b>${r.newMed.toFixed(2)}</b></td></tr>`).join('')}</table></div>${ADMIN?`<div class="row"><button class="p" onclick="confirmUpdate()">Conferma e aggiorna classifica</button><button class="s" onclick="rejectUpdate()">Rifiuta proposta</button></div>`:`<p class="mut">Proposta pronta. Solo l'Admin può confermare e applicare queste modifiche.</p>`}</div>`;
}
function rejectUpdate(){
  if(!ADMIN || !S.T || S.T.applied)return;
  if(!confirm('Rifiutare la proposta di aggiornamento della Classifica Generale?'))return;
  S.T.review='rejected';
  save();
  go('live');
}
function proponiAggiornamento(){
  if(!S.T || S.T.applied)return;
  S.T.review='pending';
  save();
  go('aggiorna');
}
function confirmUpdate(){
  if(!ADMIN || !S.T || S.T.applied)return;
  const rows=updateRows();
  if(!confirm("Confermare l'aggiornamento della Classifica Generale per tutti i "+rows.length+" giocatori?"))return;
  rows.forEach(r=>{const p=S.players.find(q=>q.id==r.id);if(p){p.tot=r.newTot;p.t=r.newT}});
  S.T.applied=true;
  S.T.review='approved';
  save();
  go('generale');
}
function applyG(){go('aggiorna')}
init();
</script></body></html>
